  name: tests

  on:
    pull_request:
      branches: [main]

  concurrency:
    group: tests-${{ github.head_ref }}
    cancel-in-progress: true

  jobs:
    helm:
      name: helm chart
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
        - uses: actions/checkout@v4

        - uses: azure/setup-helm@v5.0.1
          with:
            version: v4.2.0

        - name: lint and render chart
          run: charts/openlake/tests/render.sh

    test:
      name: cargo test
      runs-on: ubuntu-latest
      timeout-minutes: 30
      steps:
        - uses: actions/checkout@v4

        - uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt, clippy

        - name: install system dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              pkg-config clang cmake libhwloc-dev libudev-dev

        - uses: Swatinem/rust-cache@v2

        - name: fmt
          run: cargo fmt --all -- --check

        - name: clippy
          run: cargo clippy --workspace --all-targets -- -D warnings

        - name: test
          run: cargo test --workspace

        - name: Connector regression tests
          run: python3 external/connectors/vllm/tests/test_openlake_adapter.py
